<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Logger</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h1>Time Logger</h1>

  <!-- Add category -->
  <div class="section">
    <h2>Add Category</h2>
    <div class="add-category-row">
      <input type="text" id="category-input" placeholder="Category name" autocomplete="off" />
      <button id="add-btn">Add</button>
    </div>
  </div>

  <!-- Select active category -->
  <div class="section">
    <h2>Active Category</h2>
    <div class="select-row">
      <select id="category-select">
        <option value="" disabled selected>— select a category —</option>
      </select>
    </div>
    <p id="status-msg"></p>
  </div>

  <!-- Time summary table -->
  <div class="section">
    <h2>Time Summary</h2>
    <p id="empty-msg">No categories yet. Add one above.</p>
    <table id="time-table" aria-label="Time summary">
      <thead>
        <tr>
          <th>Category</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
